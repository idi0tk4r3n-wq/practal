<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박상덕을 알아보자!</title>
    <!-- 구글 픽셀 폰트 (Press Start 2P) & 가독성 높은 픽셀느낌 폰트 (DungGeunMo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
    <style>
        /* ==================== 1. CSS 변수 및 기본 스타일 ==================== */
        :root {
            /* 알록달록 상큼한 픽셀 파스텔 8비트 컬러 팔레트 */
            --bg-color: #f7d4e1;
            --bg-pattern: #f9f6f7;
            --container-bg: #ff85b1;
            --card-bg: #fafafa;
            --card-back-bg: #e0efd3;
            --text-color: #3e2d3a;
            --primary-color: #fbf5ac;
            --secondary-color: #1205ff;
            --accent-color: #fff0cc;
            --border-color: #6b1439;
            --shadow-color: rgba(74, 52, 61, 0.35);
            --sparkle-color: #ffffff;
            --pixel-border: 4px solid var(--border-color);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 20px 10px;
            font-family: 'DungGeunMo', monospace;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--bg-pattern) 18%, transparent 19%);
            background-size: 22px 22px;
            color: var(--text-color);
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 캔버스 (마우스 반짝이 파티클) */
        #sparkleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        /* 메인 컨테이너 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--container-bg);
            border: var(--pixel-border);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 12px;
            padding: 24px;
            position: relative;
        }

        /* 헤더 */
        header {
            text-align: center;
            position: relative;
            padding-bottom: 20px;
            border-bottom: 4px dashed var(--border-color);
            margin-bottom: 30px;
        }

        h1.title {
            font-family: 'Press Start 2P', 'DungGeunMo', cursive;
            font-size: 1.8rem;
            color: var(--primary-color);
            text-shadow: 3px 3px 0px var(--border-color);
            margin: 10px 0 10px 0;
            letter-spacing: -1px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .subtitle {
            font-size: 1.25rem;
            background: var(--accent-color);
            color: #2b1e23;
            display: inline-block;
            padding: 6px 16px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            font-weight: bold;
        }

        /* 섹션 공통 스타일 */
        .section-title {
            font-size: 1.45rem;
            color: var(--secondary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 1px 1px 0px var(--border-color);
        }

        .section-title::before {
            content: "★";
            color: var(--accent-color);
        }

        .arcade-box {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 4px 4px 0px var(--shadow-color);
        }

        /* 퀴즈 아이템 스타일 */
        .quiz-item {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px dashed var(--border-color);
        }
        .quiz-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        /* ==================== 2. 카드가 뒤집히는 좋아하는 것 섹션 ==================== */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border: 3px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-shadow: 3px 3px 0px var(--shadow-color);
        }

        .card-front {
            background-color: #fafafa;
            color: var(--text-color);
        }

        .card-front .icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .card-front .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--secondary-color);
        }

        .card-front .click-hint {
            font-size: 1.05rem;
            color: #3b2c5d;
            margin-top: 8px;
            background: #ffdfba;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .card-back {
            background-color: #d2e3f4;
            color: var(--text-color);
            transform: rotateY(180deg);
            justify-content: center;
        }

        .card-back p {
            font-size: 1.15rem;
            line-height: 1.5;
            word-break: keep-all;
            margin: 0;
            font-weight: bold;
        }

        /* ==================== 3. OX 퀴즈 섹션 ==================== */
        .quiz-question {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 20px;
            background: #bae1ff;
            padding: 14px;
            border-radius: 8px;
            border: 2px dashed var(--border-color);
        }

        .quiz-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-ox {
            width: 80px;
            height: 80px;
            font-size: 2rem;
            font-family: 'Press Start 2P', cursive;
            border: 4px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-color);
            transition: all 0.1s;
        }

        .btn-o {
            background: #7bdff2;
            color: #1a4959;
        }

        .btn-x {
            background: #ff928b;
            color: #5c1813;
        }

        .btn-ox:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        .quiz-result {
            margin-top: 15px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            min-height: 30px;
        }

        /* ==================== 4. 랜덤 점심 메뉴 추천 ==================== */
        .lunch-box {
            text-align: center;
        }

        .menu-display {
            font-size: 1.45rem;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #b5ead7;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 15px;
            color: #1d4d3e;
            padding: 10px;
        }

        .btn-action {
            background: var(--primary-color);
            color: black;
            font-family: 'DungGeunMo', monospace;
            font-size: 1.2rem;
            padding: 12px 24px;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-color);
            transition: all 0.1s;
            font-weight: bold;
        }

        .btn-action:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        /* ==================== 5. 10초 광클 미니게임 ==================== */
        .game-box {
            text-align: center;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            font-size: 1.35rem;
            margin-bottom: 15px;
            background: #e2f0cb;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
        }

        .btn-clicker {
            width: 100%;
            max-width: 300px;
            height: 80px;
            font-size: 1.35rem;
            background: var(--accent-color);
            color: #000;
            border: 4px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 5px 5px 0px var(--border-color);
            font-family: 'DungGeunMo', monospace;
            font-weight: bold;
        }

        .btn-clicker:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .btn-clicker:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 1rem;
            font-weight: bold;
            opacity: 0.85;
        }

        /* 모바일 대응 레이아웃 조절 */
        @media (max-width: 600px) {
            h1.title {
                font-size: 1.3rem;
            }
            .card-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
